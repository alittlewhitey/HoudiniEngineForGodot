name: Houdini Engine For Godot
run-name: Pre-build for each platform
on: 
  push:
    branches:
      - main
jobs:
  Mac-Build:
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: brew install llvm
      - run: echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - run: echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
      - run: echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
      - run: echo "LDFLAGS=\"-L/opt/homebrew/opt/llvm/lib ${LDFLAGS}\"" >> $GITHUB_ENV
      - run: echo "CPPFLAGS=\"-I/opt/homebrew/opt/llvm/include ${CPPFLAGS}\"" >> $GITHUB_ENV
      - run: export PATH="$(brew --prefix llvm)/bin:${PATH}"
      - run: git submodule update --init --recursive
      - run: pip install scons
      - run: scons --version
      - run: scons target=editor
  Linux-Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: git submodule update --init --recursive
      - run: pip install scons
      - run: scons --version
      - run: scons target=editor
        